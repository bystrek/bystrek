services:
  dockge:
    image: louislam/dockge:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /root/bystrek:/opt/stacks/bystrek
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
