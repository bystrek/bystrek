services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ghcr.io/bystrek/api:latest}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    image: ${UI_IMAGE:-ghcr.io/bystrek/ui:latest}
    restart: unless-stopped

  gateway-caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - ui
    restart: unless-stopped
    networks:
      - default
      - homelab_gateway

volumes:
  postgres_data:

networks:
  homelab_gateway:
    external: true
