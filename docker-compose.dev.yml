services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bystrek
      POSTGRES_PASSWORD: bystrek
      POSTGRES_DB: bystrek
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bystrek_dev_postgres_data:/var/lib/postgresql/data

volumes:
  bystrek_dev_postgres_data:
