<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bystrek</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bystrek">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F3E7D3;
    color: #591622;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
  }
  main {
    max-width: 360px;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 0.02em;
    margin: 0 0 8px;
  }
  p {
    opacity: 0.8;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  button {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 999px;
    border: none;
    background: #591622;
    color: #F3E7D3;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status {
    margin-top: 20px;
    font-size: 14px;
    opacity: 0.75;
    min-height: 1.2em;
  }
</style>
</head>
<body>
<main>
  <h1>bystrek</h1>
  <p>Enable notifications to let the assistant reach you. (Chat is offline for now — back soon.)</p>
  <button id="subscribe-btn">Enable notifications</button>
  <div id="status"></div>
</main>
<script>
  const btn = document.getElementById("subscribe-btn");
  const status = document.getElementById("status");

  function setStatus(text) {
    status.textContent = text;
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(base64);
    return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
  }

  async function subscribe() {
    btn.disabled = true;
    try {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        setStatus("Push isn't available here — on iPhone, add this page to your Home Screen and open it from there first.");
        btn.disabled = false;
        return;
      }

      setStatus("Requesting permission…");
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        setStatus("Permission denied.");
        btn.disabled = false;
        return;
      }

      setStatus("Registering…");
      const registration = await navigator.serviceWorker.register("/sw.js");
      await navigator.serviceWorker.ready;

      const { publicKey } = await fetch("/push/vapid-public-key").then((r) => r.json());
      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });

      await fetch("/push/subscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(subscription),
      });

      setStatus("Subscribed. You can close this.");
      btn.textContent = "Subscribed";
    } catch (err) {
      setStatus("Something went wrong: " + err.message);
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", subscribe);

  if ("serviceWorker" in navigator && "PushManager" in window) {
    navigator.serviceWorker.getRegistration().then(async (reg) => {
      const sub = reg && (await reg.pushManager.getSubscription());
      if (sub) {
        btn.textContent = "Subscribed";
        btn.disabled = true;
        setStatus("Already subscribed on this device.");
      }
    });
  }
</script>
</body>
</html>
