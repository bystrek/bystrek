<div class="shell">
  <div class="account">
    <button type="button" class="avatar" aria-label="Account menu" popovertarget="account-menu">
      @if (auth.session()?.user?.image; as src) {
        <img [src]="src" alt="" />
      } @else {
        {{ auth.session()?.user | initials }}
      }
    </button>

    <nav id="account-menu" class="menu" popover #menu>
      @if (auth.session()?.user?.name; as name) {
        <p class="who">{{ name }}</p>
      }
      <a routerLink="/agenda" routerLinkActive="active" (click)="menu.hidePopover()">Agenda</a>
      <a routerLink="/settings" routerLinkActive="active" (click)="menu.hidePopover()">Settings</a>
      <button type="button" class="sign-out" (click)="menu.hidePopover(); signOut()">
        Sign out
      </button>
    </nav>
  </div>

  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>
