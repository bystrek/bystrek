<main class="login">
  <app-stack class="login-stack" gap="space-6">
    <header class="intro">
      <h1>bystrek</h1>
      <p>Sign in to reach the assistant.</p>
    </header>

    <app-card>
      <button appButton type="button" variant="primary" block (click)="signIn()">
        Sign in with Pocket ID
      </button>
    </app-card>

    @if (error(); as code) {
      <app-alert
        class="status-alert"
        tone="danger"
        heading="Something went wrong"
        (dismissed)="error.set(null)"
      >
        {{ code | signInError }}
      </app-alert>
    }
  </app-stack>
</main>
