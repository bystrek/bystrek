<main class="login">
  <div class="ek-stack login-stack" data-gap="6">
    <header class="intro">
      <h1>bystrek</h1>
      <p>Sign in to reach the assistant.</p>
    </header>

    <div class="ek-card">
      <button class="ek-button" type="button" data-variant="primary" data-block (click)="signIn()">
        Sign in with Pocket ID
      </button>
    </div>

    @if (error(); as code) {
      <app-alert
        class="status-alert"
        tone="danger"
        heading="Something went wrong"
        (dismissed)="error.set(null)"
      >
        {{ code | signInError }}
      </app-alert>
    }
  </div>
</main>
