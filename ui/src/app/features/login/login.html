<main class="auth-shell">
  <h1>bystrek</h1>
  <p>Sign in to reach the assistant.</p>

  <form id="login" [formRoot]="loginForm" (submit)="submit()">
    <input type="email" [formField]="loginForm.email" placeholder="Email" autocomplete="email" />
    <input
      type="password"
      [formField]="loginForm.password"
      placeholder="Password"
      autocomplete="current-password"
    />
    <button type="submit" [disabled]="busy()">
      {{ pendingAction() === 'signin' ? 'Signing in…' : 'Sign in' }}
    </button>
    <button type="button" class="link" (click)="forgotPassword()" [disabled]="busy()">
      {{ pendingAction() === 'reset' ? 'Sending…' : 'Forgot password?' }}
    </button>
  </form>

  @if (status()) {
    <div class="status" [class.error]="statusError()">{{ status() }}</div>
  }
</main>
