<main class="chat-shell">
  <div class="chat-toolbar">
    <label for="conversation-select">Conversation</label>
    <select
      #conversationPicker
      id="conversation-select"
      [value]="chat.activeConversationId() ?? ''"
      [disabled]="chat.loading() || chat.sending()"
      (change)="chat.selectConversation(conversationPicker.value)"
    >
      @if (!chat.activeConversationId()) {
        <option value="">No conversation</option>
      }
      @for (conversation of chat.conversations(); track conversation.id) {
        <option [value]="conversation.id">{{ conversation.title }}</option>
      }
    </select>
    <button type="button" (click)="newChat()" [disabled]="chat.loading() || chat.sending()">
      New chat
    </button>
  </div>
  <div class="messages">
    @for (message of chat.messages(); track $index; let last = $last) {
      @if (last && chat.sending() && message.role === 'assistant' && !message.text) {
        <div class="bubble assistant pending" role="status" aria-label="Assistant is thinking">
          <span class="spinner" aria-hidden="true"></span>
        </div>
      } @else {
        <div
          class="bubble"
          [class.user]="message.role === 'user'"
          [class.assistant]="message.role === 'assistant'"
          [innerHTML]="message.text | markdown"
        ></div>
      }
    }
    <div #scrollAnchor></div>
  </div>

  <app-status-banner [message]="chat.error()" [error]="true" />

  <form id="chat-input" [formRoot]="draftForm" (submit)="send()">
    <input type="text" [formField]="draftForm.draft" placeholder="Message" />
    <button
      type="submit"
      class="send"
      [disabled]="chat.sending() || chat.loading()"
      aria-label="Send message"
    >
      <app-icon name="arrow-up" />
    </button>
  </form>
</main>
