<main class="chat-shell">
  <div class="messages">
    @for (message of chat.messages(); track $index) {
      <div
        class="bubble"
        [class.user]="message.role === 'user'"
        [class.assistant]="message.role === 'assistant'"
        [innerHTML]="message.text | markdown"
      ></div>
    }
    <div #scrollAnchor></div>
  </div>

  <app-status-banner [message]="chat.error()" [error]="true" />

  <form id="chat-input" [formRoot]="draftForm" (submit)="send()">
    <input type="text" [formField]="draftForm.draft" placeholder="Message" />
    <button type="submit" class="send" [disabled]="chat.sending()" aria-label="Send message">
      <app-icon name="arrow-up" />
    </button>
  </form>
</main>
