<section class="command" [attr.aria-label]="label()">
  <div class="response" aria-live="polite">
    @if (busy()) {
      <div class="thinking">
        <p class="asked">&gt; {{ asked() }}</p>
        <progress class="ek-progress" [attr.aria-label]="thinkingLabel()" max="100"></progress>
      </div>
    }
    <ng-content select="[commandBarResult]" />
  </div>

  <ng-content />

  <form class="bar" [formRoot]="textForm" (submit)="$event.preventDefault(); submit()">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <input
      class="field"
      type="text"
      autocomplete="off"
      [placeholder]="placeholder()"
      [attr.aria-label]="label()"
      [formField]="textForm"
    />
    @if (busy()) {
      <button
        class="ek-button"
        type="button"
        data-shape="icon"
        aria-label="Stop"
        (click)="stopped.emit()"
      >
        <app-icon name="stop" />
      </button>
    } @else {
      @if (clearable() && text()) {
        <button
          class="ek-button"
          type="button"
          data-shape="icon"
          aria-label="Clear"
          [disabled]="locked()"
          (click)="cleared.emit()"
        >
          <app-icon name="x" />
        </button>
      }
      <button
        class="ek-button"
        type="submit"
        data-variant="primary"
        data-shape="icon"
        [disabled]="locked()"
        [attr.aria-label]="submitLabel()"
      >
        <app-icon name="arrow-right" />
      </button>
    }
  </form>

  <ng-content select="[commandBarHint]" />
</section>
