name: build selected ref

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build, such as refs/pull/64/head
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - id: revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: tag
        run: echo "image_tag=ref-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/api:${{ steps.tag.outputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ steps.revision.outputs.revision }}

      - uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ui:${{ steps.tag.outputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ steps.revision.outputs.revision }}

      - name: Summarize images
        run: |
          {
            echo "## Selected ref built"
            echo
            echo "Revision: \`${{ steps.revision.outputs.revision }}\`"
            echo
            echo "Image tag: \`${{ steps.tag.outputs.image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
