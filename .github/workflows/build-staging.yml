name: build staging images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build, such as refs/pull/64/head
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - id: revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: tag
        run: echo "image_tag=staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/api:${{ steps.tag.outputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ steps.revision.outputs.revision }}

      - uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ui:${{ steps.tag.outputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ steps.revision.outputs.revision }}

  deploy-instructions:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish staging deployment command
        run: |
          {
            echo "## Staging image built"
            echo
            echo "Revision: \`${{ needs.build.outputs.revision }}\`"
            echo
            echo "On the home server, run:"
            echo
            echo "\`\`\`sh"
            echo "cd ~/bystrek && ./deploy.sh ${{ needs.build.outputs.image_tag }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
