# Tests and builds api and ui on every PR and merge to main. Images are built
# as a check only; release.yml is the only workflow that pushes them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Required status checks must run (even as a no-op) or GitHub leaves them
  # pending forever on doc-only PRs. This job always runs; the rest skip
  # their real work via `needs.changes.outputs.api` / `.ui` — a skipped
  # conclusion still satisfies a required check, unlike a job that never ran
  # at all. API-only PRs skip the ui jobs and vice versa.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - ".prettierrc"
              - ".github/workflows/deploy.yml"
            api:
              - *shared
              - "api/**"
            ui:
              - *shared
              - "ui/**"
              - "ekierka/**"
              - "package.json"
              - "bun.lock"

  test-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bystrek
          POSTGRES_PASSWORD: bystrek
          POSTGRES_DB: bystrek
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bystrek:bystrek@localhost:5432/bystrek
      CORS_ORIGINS: http://localhost:4200
      # Throwaway values, only to satisfy env.ts's required() checks. Tests
      # talk to a fake Pocket ID (test/integration/support/fake-pocket-id.ts).
      AUTH_SECRET: ci-only-throwaway-secret-not-used-for-anything-real
      OIDC_CLIENT_ID: ci-only-client
      OIDC_CLIENT_SECRET: ci-only-throwaway-not-a-real-secret
      # Throwaway, but must decode to 32 bytes (AES-256) for env.ts's check.
      ENCRYPTION_KEY: q8Uj3wsNN67RSs76SMLKQ/OIW6vE8Fmm7suUEmBlaaM=
      # Throwaway; tests stub fetch, nothing calls the model.
      LLM_BASE_URL: http://localhost:9/v1
      LLM_MODEL: ci-only-model
      LLM_API_KEY: ci-only-throwaway-not-a-real-key
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run format:check

      - run: bun run db:migrate

      - run: bun run test

      - run: bun run test:integration

  build-api:
    needs: [changes, test-api]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false

  test-ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # Ships Chromium, WebKit and Firefox plus their system libraries, so no
    # apt-get on every run. Tag must match the locked `playwright` version in
    # bun.lock (pinned exactly in ui/ and ekierka/elements), or Playwright
    # re-downloads browsers into the container anyway.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    env:
      CI: true
      # Firefox refuses to start as root with the runner's HOME.
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      # setup-bun needs unzip, which the image lacks, and installing it via
      # apt-get ties the job to the Ubuntu mirrors. Install Bun from npm
      # instead (the image ships Node), at the version in packageManager.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      # One workspace install at the repo root (ekierka/* and ui).
      - run: bun install --frozen-lockfile

      - name: Ekierka elements
        working-directory: ekierka/elements
        run: |
          bun run format:check
          bun run build
          bun run test

      - name: Ekierka Angular wrappers and generator
        working-directory: ekierka/angular
        run: |
          bun run format:check
          bun run build
          bun run test

      - name: ui
        working-directory: ui
        run: |
          bun run format:check
          bun run test
          bun run test:e2e

      # axe on every Storybook story, plus key-screen screenshots against the
      # baselines committed in ui/e2e/visual. Update them with scripts/visual-baselines.sh.
      - name: Axe and key-screen screenshots
        working-directory: ui
        run: bun run test:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: ui/test-results
          if-no-files-found: ignore

  build-ui:
    needs: [changes, test-ui]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The workspace needs the root lockfile and ekierka/, so the context is
      # the repo root.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          push: false
