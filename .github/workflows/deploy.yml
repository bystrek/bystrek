name: build and deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ui/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "ui/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bystrek
          POSTGRES_PASSWORD: bystrek
          POSTGRES_DB: bystrek
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bystrek:bystrek@localhost:5432/bystrek
      CORS_ORIGINS: http://localhost:5173
      # Throwaway keypair, valid VAPID format so web-push's own validation
      # passes at module load — never used for real push delivery.
      VAPID_PUBLIC_KEY: BCDkc1IJbAji8zAPWCCflEwIWVf1g_HIvS8mhYwimSs-uKYqD69w0D-afL6BBO-T7u5FPkAB4suDInJoIh73S3k
      VAPID_PRIVATE_KEY: sj8y9H6j5ouxhvMvuuQ9ZEPwV09O3Q4FHn_uLn7rX5g
      VAPID_SUBJECT: mailto:ci@bystrek.dev
      # Throwaway values — tests stub sendResetPassword rather than hitting
      # Resend, this only needs to satisfy env.ts's required() check.
      AUTH_SECRET: ci-only-throwaway-secret-not-used-for-anything-real
      RESEND_API_KEY: ci-only-throwaway-not-a-real-key
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run db:migrate

      - run: bun run test

      - run: bun run test:integration

  build-api:
    needs: test-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/api:latest
            ghcr.io/${{ github.repository_owner }}/api:${{ github.sha }}

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    env:
      PUBLIC_API_URL: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}

      - run: bunx playwright install --with-deps webkit

      - run: bun run test:e2e

  build-ui:
    needs: test-ui
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./ui
          build-args: |
            PUBLIC_API_URL=https://api.bystrek.dev
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ui:latest
            ghcr.io/${{ github.repository_owner }}/ui:${{ github.sha }}

  deploy:
    needs: [build-api, build-ui]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Trigger deploy over SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} deploy
